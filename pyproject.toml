[project]
name = "alfred-ai"
version = "0.1.0"
description = "Alfred - a voice-first buddy on top of Claude (wake word, read-only files, voice-approved writes, screen vision, web search, overlay)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2",
    "pyyaml>=6",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "webrtcvad-wheels>=2.0.11",
    "faster-whisper>=1.0",
    "pyttsx3>=2.90",
    "keyboard>=0.13",
    "mss>=9",
    "pillow>=10",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.2"]
overlay = ["PyQt6>=6.6"]
openwakeword = ["openwakeword>=0.6"]
porcupine = ["pvporcupine>=3"]
all = ["piper-tts>=1.2", "PyQt6>=6.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
alfred = "alfred.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alfred*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
